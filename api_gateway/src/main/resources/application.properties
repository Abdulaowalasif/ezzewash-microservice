spring.application.name=api-gateway
server.port=${SERVER_PORT:3000}

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:3001}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/users/**

spring.cloud.gateway.server.webflux.routes[1].id=catalog-service
spring.cloud.gateway.server.webflux.routes[1].uri=${CATALOG_SERVICE_URL:http://localhost:3002}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/branches/**,/api/v1/services/**,/api/v1/items/**,/api/v1/service-items/**,/api/v1/offers/**,/api/v1/reviews/**,/api/v1/branch-memberships/**

spring.cloud.gateway.server.webflux.routes[2].id=order-service
spring.cloud.gateway.server.webflux.routes[2].uri=${ORDER_SERVICE_URL:http://localhost:3003}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/orders/**,/api/v1/capacity-slots/**,/api/v1/internal/**

spring.cloud.gateway.server.webflux.routes[3].id=rider-service
spring.cloud.gateway.server.webflux.routes[3].uri=${RIDER_SERVICE_URL:http://localhost:3004}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/riders/**,/api/v1/rider-assignments/**

spring.cloud.gateway.server.webflux.routes[4].id=payment-service
spring.cloud.gateway.server.webflux.routes[4].uri=${PAYMENT_SERVICE_URL:http://localhost:3005}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/payments/**,/api/payment-settlements/**

spring.cloud.gateway.server.webflux.routes[5].id=notification-service
spring.cloud.gateway.server.webflux.routes[5].uri=${NOTIFICATION_SERVICE_URL:http://localhost:3006}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/notifications/**

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always