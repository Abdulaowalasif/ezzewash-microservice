services:

  auth-service:
    image: ezzewash/auth-service:1.3
    container_name: ezzewash-auth-service
    restart: unless-stopped

    ports:
      - "3001:3001"

    env_file:
      - .env

    environment:
      NODE_ENV: production

      # IMPORTANT:
      # Use Docker service names, NOT localhost.
      MONGODB_URI: mongodb://mongodb:27017/ezzewash
      REDIS_URL: redis://redis:6379

    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - uploads:/app/uploads

  mongodb:
    image: mongo:8
    container_name: ezzewash-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ezzewash-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
  redis_data:
  uploads:
